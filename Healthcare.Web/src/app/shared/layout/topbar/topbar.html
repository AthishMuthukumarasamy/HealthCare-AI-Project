
<header class="topbar">
  <div class="breadcrumb">
    <span>Workspace</span>
    <span class="breadcrumb-divider">/</span>
    <strong>Dashboard</strong>
  </div>

  <div class="topbar-actions">
    <button
      class="icon-button"
      type="button"
      aria-label="Notifications"
    >
      ♧
      <span class="notification-dot"></span>
    </button>

    <div class="topbar-user">
      <div class="avatar small-avatar">
        {{ auth.currentUser()?.fullName?.charAt(0)?.toUpperCase() || 'U' }}
      </div>

      <div class="topbar-user-details">
        <strong>{{ auth.currentUser()?.fullName || 'User' }}</strong>
        <span>{{ auth.currentUser()?.roles?.join(', ') || 'Member' }}</span>
      </div>
    </div>
  </div>
</header>
